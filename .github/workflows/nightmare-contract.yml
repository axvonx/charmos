name: Nightmare contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/charm/nightmare/**'
      - 'scripts/charm/*.py'
      - 'scripts/gen_limine_conf.py'
      - 'scripts/tests/**'
      - 'nightmare/**'
      - '.github/workflows/nightmare-contract.yml'
      - '.github/workflows/nightmare-orchestrator.yml'
      - '.github/workflows/nightmare-recovery.yml'
  pull_request:
    paths:
      - 'scripts/charm/nightmare/**'
      - 'scripts/charm/*.py'
      - 'scripts/gen_limine_conf.py'
      - 'scripts/tests/**'
      - 'nightmare/**'
      - '.github/workflows/nightmare-contract.yml'
      - '.github/workflows/nightmare-orchestrator.yml'
      - '.github/workflows/nightmare-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightmare-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install contract tools
        run: python3 -m pip install ruff mypy pytest jsonschema

      - name: Validate contracts and orchestration
        run: |
          ruff check scripts
          ruff format --check scripts
          mypy
          pytest -q
          PYTHONPATH=scripts python3 -m charm ci workflow-policy

      - name: Planner and matrix smoke
        env:
          RUNNER_IMAGE: ghcr.io/axvonx/charmos-x86-env@sha256:5a15823fa602f60da3d2819181db0729237eba7d812baaab0d27d59e9c4ebdc3
        run: |
          export PYTHONPATH=scripts
          python3 -m charm nightmare repository-command \
            --suite harness_smoke \
            --repository axvonx/charmos \
            --ref main \
            --at 2026-08-29T00:00:00Z \
            --command-out command.json \
            --snapshot-out snapshot.json
          python3 -m charm nightmare plan command.json snapshot.json \
            --source-commit 56bc1dfdd14a0b3e03ff1d166e7af98bec8cbb6f \
            --runner-image "$RUNNER_IMAGE" \
            --ownership repository \
            --out plan.json
          python3 -m charm nightmare matrix build plan.json

      - name: Planner smoke for a gating suite
        env:
          RUNNER_IMAGE: ghcr.io/axvonx/charmos-x86-env@sha256:5a15823fa602f60da3d2819181db0729237eba7d812baaab0d27d59e9c4ebdc3
        run: |
          export PYTHONPATH=scripts
          python3 -m charm nightmare repository-command \
            --suite overnight_locks \
            --repository axvonx/charmos \
            --ref main \
            --at 2026-08-29T00:00:00Z \
            --command-out gate-command.json \
            --snapshot-out gate-snapshot.json
          python3 -m charm nightmare plan gate-command.json gate-snapshot.json \
            --source-commit 56bc1dfdd14a0b3e03ff1d166e7af98bec8cbb6f \
            --runner-image "$RUNNER_IMAGE" \
            --ownership repository \
            --out gate-plan.json
          python3 -m charm nightmare matrix build gate-plan.json
