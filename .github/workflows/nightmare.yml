name: Nightmare flag matrix


on:
  schedule:
    # NOTE: GitHub cron routinely runs late at peak usage times
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      compiler:
        description: "gcc or clang"
        required: false
        default: "clang"

permissions:
  contents: read
  packages: read

concurrency:
  group: nightmare
  cancel-in-progress: false

env:
  PYTHONPATH: scripts
  COMPILER: ${{ github.event.inputs.compiler || 'clang' }}

jobs:
  flags:
    name: ${{ matrix.scenario.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        scenario:
          - name: NIGHTMARE_LOCKS_SMP8
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_LOCKS=ON
            smp: "sockets=2,cores=2,threads=2"
          - name: NIGHTMARE_LOCKS_UP
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_LOCKS=ON
            smp: "sockets=1,cores=1,threads=1"
          - name: NIGHTMARE_WAKE_SMP8
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_WAKE=ON
            smp: "sockets=2,cores=2,threads=2"
          - name: NIGHTMARE_WAKE_UP
            flags: -DTEST_NIGHTMARE_ALL=OFF -DTEST_NIGHTMARE_WAKE=ON
            smp: "sockets=1,cores=1,threads=1"
          - name: NIGHTMARE_ALL_SMP8
            flags: -DTEST_NIGHTMARE_ALL=ON
            smp: "sockets=2,cores=2,threads=2"
          - name: NIGHTMARE_ALL_KASAN
            flags: -DTEST_NIGHTMARE_ALL=ON -DDEBUG_ASAN=ON
            smp: "sockets=2,cores=2,threads=2"
            compiler: clang

    container:
      image: ghcr.io/axvonx/charmos-x86-env@sha256:2f77dec0b8a479bdfb8f9237ceb0c10320e418c5725592033cd9451e63fced87
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve scenario settings
        id: cfg
        run: |
          set -euo pipefail
          compiler="${{ matrix.scenario.compiler || '' }}"
          [ -n "$compiler" ] || compiler="$COMPILER"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
          # Seed is derived from the run and attempt so it is recorded
          echo "seed=0x${{ github.run_id }}${{ github.run_attempt }}" \
              >> "$GITHUB_OUTPUT"

      - name: Install clang toolchain
        if: steps.cfg.outputs.compiler == 'clang'
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! command -v ld.lld >/dev/null 2>&1; then
            apt-get update && apt-get install -y clang lld llvm
          fi

      - name: Compile
        run: |
          ./scripts/build.sh -t RelWithDebInfo \
            --compiler "${{ steps.cfg.outputs.compiler }}" \
            -- ${{ matrix.scenario.flags }} \
               -DMACHINE_SMP="${{ matrix.scenario.smp }}"

      - name: Boot and run the harness
        env:
          TERM: dumb
        run: |
          set -uo pipefail
          # GitHub runs under bash -e, capturing a non-zero return code
          # from timeout/QEMU requires errexit off
          set +e
          mkdir -p results
          start=$(date +%s)

          # Booting and running the harness takes about a minute
          timeout --foreground -k 30 600 \
              cmake --build build --target tests
          rc=$?
          pkill -f qemu-system-x86_64 2>/dev/null || true
          end=$(date +%s)

          cp build/output.log results/run.log 2>/dev/null || \
              echo "(no serial log produced)" > results/run.log
          # stderr (QEMU), kept out of the guest log
          cp build/output.stderr.log results/run.stderr.log 2>/dev/null || true
          cp build/ndjson.log results/run.nd.log 2>/dev/null || true

          {
            echo "SHARD=${{ matrix.scenario.name }}"
            echo "COMPILER=${{ steps.cfg.outputs.compiler }}"
            echo "SCENARIO=${{ matrix.scenario.name }}"
            echo "SEED=${{ steps.cfg.outputs.seed }}"
            echo "EXIT_CODE=$rc"
            echo "DURATION_S=$((end - start))"
            echo "SHA=${{ github.sha }}"
            echo "CONFIG=smp=${{ matrix.scenario.smp }}"
          } > results/run.env

          tail -60 results/run.log || true
          gzip -9 results/*.log

          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-${{ matrix.scenario.name }}
          path: results/
          retention-days: 30

  report:
    name: Report
    needs: flags
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: nightmare-*
          path: artifacts

      - name: Parse and aggregate
        run: |
          # --fail-on-error is what makes this workflow able to report a
          # failure at all: without it every shard could fail and the run would
          # still be green, because the boot step swallows its own exit code so
          # that a failing shard still uploads its logs
          python3 -m charm ci ingest artifacts \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json report.json \
            --fail-on-error

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-report
          path: report.json
          retention-days: 90
